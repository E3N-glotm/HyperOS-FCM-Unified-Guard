name: HyperOS4 Fork CI

on:
  push:
    branches: [main, hyperos4-fcm]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew :HyperFCMLive:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-FCM-Live-E3N-HyperOS4-debug
          path: HyperFCMLive/build/outputs/apk/debug/*.apk
          if-no-files-found: error
