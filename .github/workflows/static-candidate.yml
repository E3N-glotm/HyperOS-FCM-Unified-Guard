name: Validate Magisk-only static candidate
on:
  push:
    branches: [main, 'codex/pure-magisk-static-v030']
  pull_request:
    paths: ['static-patch/**', '.github/workflows/static-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build and check static policy
        run: |
          python static-patch/build.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
          python static-patch/test.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
          python static-patch/test-adaptive-runtime.py
          for f in static-patch/overlay/*.sh static-patch/overlay/bin/*.sh; do sh -n "$f"; done
          python static-patch/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: HyperOS-FCM-Unified-Guard-v0.4.0-alpha.3-static
          path: |
            dist/HyperOS-FCM-Unified-Guard-v0.4.0-alpha.3-static.zip
            dist/HyperOS-FCM-Unified-Guard-v0.4.0-alpha.3-static.zip.sha256
          if-no-files-found: error
