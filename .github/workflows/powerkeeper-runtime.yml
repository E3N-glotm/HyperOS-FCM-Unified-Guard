name: Validate cross-ROM PowerKeeper runtime policy (not shipped)
on:
  push:
    paths:
      - 'powerkeeper-runtime/**'
      - '.github/workflows/powerkeeper-runtime.yml'
  pull_request:
    paths:
      - 'powerkeeper-runtime/**'
      - '.github/workflows/powerkeeper-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test PowerKeeper old/new runtime methods
        run: python3 powerkeeper-runtime/test_runtime.py
      - name: Install Android SDK for bridge DEX build
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile optional Java bridge (no native activation)
        run: python3 powerkeeper-runtime/build.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
      - name: Verify artifact and do not deploy native hooks
        run: test -s powerkeeper-runtime/build/powerkeeper-runtime.dex
