name: Experimental scoped PowerKeeper Zygisk native build (NOT RELEASED)
on:
  pull_request:
    paths:
      - 'powerkeeper-runtime/**'
      - 'static-patch/overlay/bin/powerkeeper_processes.sh'
      - 'static-patch/overlay/bin/powerkeeper_probe.sh'
      - '.github/workflows/powerkeeper-native-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK for experimental build
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"
          python3 -m pip install --user cmake==3.31.6 ninja
      - name: Compile and test isolated Java policy/Dex bridge
        run: |
          python3 powerkeeper-runtime/test_runtime.py
          python3 powerkeeper-runtime/build.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
      - name: Fetch licensed native sources and pin revisions in build evidence
        run: bash powerkeeper-runtime/fetch-deps.sh
      - name: Verify backported ART initialization ordering
        run: python3 powerkeeper-runtime/backport_lsplant_init_safety.py --verify
      - name: Exercise ART callback publication barrier (host stress)
        run: |
          clang++ -std=c++23 -O2 -pthread -UNDEBUG -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -Ipowerkeeper-runtime/third_party/lsplant/lsplant/src/main/jni/include -Ipowerkeeper-runtime/third_party/lsplant/lsplant/src/main/jni/include/utils powerkeeper-runtime/test-host-init-barrier.cpp -o /tmp/fcmu-art-init-test
          for i in $(seq 1 40); do timeout 5 /tmp/fcmu-art-init-test; done
      - name: Build PowerKeeper-process-only Zygisk candidate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          export FCMU_PK_EXPERIMENT_DIAGNOSTICS=ON
          bash powerkeeper-runtime/build-native.sh
          file powerkeeper-runtime/build/native/libfcmu_pk.so
          file powerkeeper-runtime/build/native/libfcmu_pk_selftest.so
      - name: Build isolated Android ART init driver
        run: python3 powerkeeper-runtime/build_init_test.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME"
      - name: Audit default-disabled one-shot experiment package (never released)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          root = Path("powerkeeper-runtime/build")
          with ZipFile("/tmp/fcmu-ci-source.zip", "w") as z:
              for path in ["native/libfcmu_pk.so", "native/libfcmu_pk_selftest.so", "powerkeeper-runtime.dex"]:
                  z.write(root / path, "build/" + path)
          digest = hashlib.sha256(Path("/tmp/fcmu-ci-source.zip").read_bytes()).hexdigest()
          Path("/tmp/fcmu-ci-source.sha256").write_text(digest)
          PY
          python3 powerkeeper-runtime/package_scoped_test.py \
            --ci-zip /tmp/fcmu-ci-source.zip \
            --ci-sha256 "$(cat /tmp/fcmu-ci-source.sha256)" \
            --out /tmp/fcmu-ci-disabled-experiment.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile("/tmp/fcmu-ci-disabled-experiment.zip") as z:
              assert z.testzip() is None
              assert "disable" in z.namelist()
              assert "skip_mount" in z.namelist()
              assert "zygisk/arm64-v8a.so" in z.namelist()
              assert not any(x.startswith("system/") for x in z.namelist())
              for name in ("post-fs-data.sh", "service.sh"):
                  assert b"disable" in z.read(name)
          print("EXPERIMENT_PACKAGE_FAIL_CLOSED_OK")
          PY
          python3 powerkeeper-runtime/stage_experiment_usb.py \
            --zip /tmp/fcmu-ci-disabled-experiment.zip \
            --sha256 "$(sha256sum /tmp/fcmu-ci-disabled-experiment.zip | cut -d ' ' -f1)" \
            --check-only
      - uses: actions/upload-artifact@v4
        with:
          name: powerkeeper-zygisk-experimental-not-installable
          path: |
            powerkeeper-runtime/build/native/libfcmu_pk.so
            powerkeeper-runtime/build/native/libfcmu_pk_selftest.so
            powerkeeper-runtime/build/art-init-test.jar
            powerkeeper-runtime/build/powerkeeper-runtime.dex
            powerkeeper-runtime/dependency-versions.txt
          if-no-files-found: error
